name: Database tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Postgres and pgTAP
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16 postgresql-16-pgtap
          sudo systemctl start postgresql

      - name: Set up test database
        run: sudo -u postgres bash -c "PGDATABASE=wnj_test bash supabase/tests/setup.sh"

      - name: Run database tests
        run: sudo -u postgres bash -c "pg_prove -d wnj_test supabase/tests/database/*.test.sql"
